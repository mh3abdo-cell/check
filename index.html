<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>System Check</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  .popup{
    width:min(92vw,360px);
    background:#1c1c1e;color:#f2f2f7;
    border-radius:16px;padding:18px 16px 14px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.08);
    animation:pop .22s ease-out;
  }
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .title{font-size:17px;font-weight:700;text-align:center;margin-bottom:6px}
  .msg{font-size:13px;color:#aeaeb2;text-align:center;line-height:1.45;margin-bottom:14px}
  .bar-wrap{background:#2c2c2e;border-radius:999px;height:8px;overflow:hidden;margin:0 4px 8px}
  .bar{height:100%;width:0%;background:#0a84ff;transition:width .2s linear}
  .pct{font-size:12px;color:#8e8e93;text-align:center;margin-bottom:10px}
  .log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.65;color:#d1d1d6;background:#000;border-radius:10px;padding:10px;min-height:110px;direction:ltr;text-align:left}
  .ok{color:#30d158}.warn{color:#ffd60a}
  .btns{display:flex;gap:8px;margin-top:12px}
  button{
    flex:1;border:0;border-radius:12px;padding:11px 10px;font-size:15px;font-weight:600;
    background:#0a84ff;color:#fff;
  }
  button.ghost{background:#2c2c2e;color:#f2f2f7}
  button:disabled{opacity:.5}
  .done{display:none;margin-top:10px;text-align:center;font-size:13px;color:#30d158;line-height:1.5}
  .done.show{display:block}
  .win{background:#0a0a0a;border:1px solid #17ff5e;border-radius:8px;overflow:hidden;text-align:center}
  .winbar{background:#c0392b;color:#fff;font-size:12px;padding:6px;text-align:left;direction:ltr}
  .winbody{padding:14px 12px}
  .wtitle{font-size:16px;font-weight:700;color:#ff5555;margin-bottom:8px}
  .wdev{font-size:12px;color:#17ff5e;font-family:monospace;direction:ltr;margin-bottom:10px;word-break:break-word}
  .wmsg{font-size:15px;font-weight:700;color:#f2f2f7;margin-bottom:6px}
  .win small{display:block;font-weight:400;color:#b7e4c7;font-size:12px}
</style>
</head>
<body>
  <div class="popup" role="dialog" aria-modal="true">
    <div class="title">فحص الجهاز</div>
    <div class="msg">رسالة نظام · جاري التحقق من أمان الجهاز. لا تغلق النافذة.</div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="pct" id="pct">0%</div>
    <div class="log" id="log">Waiting...</div>
    <div class="btns">
      <button class="ghost" type="button" onclick="history.back()">إلغاء</button>
      <button id="btn" type="button" onclick="start()">موافق</button>
    </div>
    <div class="done" id="done">تمام… مافيش حاجة 😄<br>الفحص كاذب وما مسّ الجهاز.</div>
  </div>
<script>
const steps=[
  "[*] Connecting to target device...",
  "[*] جاري فحص الاستوديو...",
  "[*] جاري فحص برامج الجوال...",
  "[*] جاري فحص الصور والملفات...",
  "[*] جاري تثبيت وحدة التتبع...",
  "[✓] Access established"
];
let running=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function start(){
  if(running) return;
  running=true;
  const btn=document.getElementById('btn');
  const log=document.getElementById('log');
  const bar=document.getElementById('bar');
  const pct=document.getElementById('pct');
  const done=document.getElementById('done');
  btn.disabled=true; btn.textContent='جاري...';
  done.classList.remove('show'); log.innerHTML='';
  for(let i=0;i<steps.length;i++){
    const d=document.createElement('div');
    d.textContent=steps[i];
    if(steps[i].startsWith('[✓]')) d.className='ok';
    log.appendChild(d);
    const p=Math.round(((i+1)/steps.length)*100);
    bar.style.width=p+'%'; pct.textContent=p+'%';
    await sleep(850);
  }
  await sleep(400);
  document.getElementById('devline').textContent='Device: '+navigator.platform+' | '+(navigator.userAgentData?navigator.userAgentData.platform:navigator.userAgent.slice(0,40));
  done.classList.add('show');
  btn.textContent='تم';
  btn.disabled=false;
  running=false;
}
// auto-start shortly after open so it feels like a system popup
setTimeout(()=>{ if(!running) start(); }, 400);
</script>
</body>
</html>
